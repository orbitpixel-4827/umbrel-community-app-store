name: Build Basta image
on:
  push:
    branches: [main]
    paths:
      - "experimental-basta/server.py"
      - "experimental-basta/static/**"
      - "experimental-basta/tests/**"
      - "experimental-basta/Dockerfile"
      - ".github/workflows/basta-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: basta-image
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental-basta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node --test tests/*.test.mjs
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check static/app.mjs
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Basta
        uses: docker/build-push-action@v6
        with:
          context: ./experimental-basta
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/orbitpixel-4827/basta:1.0.0
          labels: |
            org.opencontainers.image.title=Basta
            org.opencontainers.image.source=https://github.com/orbitpixel-4827/umbrel-community-app-store
            org.opencontainers.image.version=1.0.0
