name: Build Basta image

on:
  push:
    branches: [main]
    paths:
      - "experimental-basta/Dockerfile"
      - "experimental-basta/nginx.conf"
      - "experimental-basta/static/**"
      - ".github/workflows/basta-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: basta-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental-basta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check game script
        run: |
          test -s static/index.html
          node -e "const h=require('fs').readFileSync('static/index.html','utf8');const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]).join('\n');require('fs').writeFileSync('/tmp/game.js',m);"
          node --check /tmp/game.js

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Basta for Intel and ARM
        uses: docker/build-push-action@v6
        with:
          context: ./experimental-basta
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/orbitpixel-4827/basta:2.0.0
          labels: |
            org.opencontainers.image.title=Basta
            org.opencontainers.image.description=Juego de mesa Basta digital para umbrelOS
            org.opencontainers.image.source=https://github.com/orbitpixel-4827/umbrel-community-app-store
            org.opencontainers.image.version=2.0.0
