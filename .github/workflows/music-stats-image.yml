name: Build Music Stats image

on:
  push:
    branches: [main]
    paths:
      - "experimental-music-stats/**"
      - ".github/workflows/music-stats-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: music-stats-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish for Intel and ARM
        uses: docker/build-push-action@v6
        with:
          context: ./experimental-music-stats
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/orbitpixel-4827/music-stats:1.0.0
          labels: |
            org.opencontainers.image.title=Music Stats
            org.opencontainers.image.source=https://github.com/orbitpixel-4827/umbrel-community-app-store
            org.opencontainers.image.version=1.0.0
      - name: Verify published app
        run: |
          docker run -d --name music-stats-check -p 3001:3001 ghcr.io/orbitpixel-4827/music-stats:1.0.0
          trap 'docker logs music-stats-check; docker rm -f music-stats-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:3001/api/health
          curl --fail http://localhost:3001/ | grep 'id="root"'
          curl --fail http://localhost:3001/stats | grep 'id="root"'
          curl --fail http://localhost:3001/api/dashboard
