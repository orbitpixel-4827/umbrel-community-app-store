name: Build Ahorros Familiares image

on:
  push:
    branches: [main]
    paths:
      - "experimental-ahorros-familiares/Dockerfile"
      - "experimental-ahorros-familiares/.dockerignore"
      - "experimental-ahorros-familiares/app.py"
      - "experimental-ahorros-familiares/manage.py"
      - "experimental-ahorros-familiares/static/**"
      - "experimental-ahorros-familiares/tests/**"
      - ".github/workflows/ahorros-familiares-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ahorros-familiares-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental-ahorros-familiares
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test database migration
        run: python -B -m unittest discover -s tests -v
      - name: Check application sources
        run: |
          python -B -m py_compile app.py manage.py
          node --check static/app.js

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish for Intel and ARM
        uses: docker/build-push-action@v6
        with:
          context: ./experimental-ahorros-familiares
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/orbitpixel-4827/ahorros-familiares:1.0.0
          labels: |
            org.opencontainers.image.title=Ahorros Familiares
            org.opencontainers.image.description=Ahorros familiares privados para umbrelOS
            org.opencontainers.image.source=https://github.com/orbitpixel-4827/umbrel-community-app-store
            org.opencontainers.image.version=1.0.0
