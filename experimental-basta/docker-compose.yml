version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: experimental-basta_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/orbitpixel-4827/basta:2.0.0
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
