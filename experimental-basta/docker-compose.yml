version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: experimental-basta_web_1
      APP_PORT: 8765
  web:
    image: ghcr.io/orbitpixel-4827/basta:1.0.0@sha256:32235058c58444e4e4b120394b3794cd1a7e36e2ad687bda6f03c04d2c8765d6
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      BIND: 0.0.0.0
      PORT: 8765
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
