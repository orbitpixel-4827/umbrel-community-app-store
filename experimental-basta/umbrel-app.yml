manifestVersion: 2.0
id: experimental-basta
storage:
  dataRoot: data
name: Basta
version: "1.0.0"
tagline: Una categoría, diez segundos y todas tus ideas
icon: https://raw.githubusercontent.com/orbitpixel-4827/umbrel-community-app-store/main/experimental-basta/icon.png
category: games
port: 9089
description: >-
  Reúne de 2 a 10 participantes para jugar Basta en una pantalla compartida.
  Agrega nombres y fotos con encuadre circular, descubre quién comienza al azar
  y responde a 55 categorías antes de que pasen diez segundos.
  Cada letra suma un punto. El centro muestra la cara de quien juega y el tiempo restante.
  Incluye modo clásico y modo ráfaga, eliminación por ronda, prórrogas y marcador automático.
  El grupo valida las respuestas en voz alta; no se utiliza el micrófono.
  Los nombres, avatares y partidas se conservan en tu Umbrel.
  El mazo contiene 5 categorías comprobadas y 50 nuevas; no reproduce las 144 de la edición comercial.
releaseNotes: >-
  Primera versión con apariencia de juego de mesa, hasta diez participantes, recorte de avatares,
  rueda interactiva, categorías aleatorias y puntos automáticos por letra.
developer: Experimental Labs
