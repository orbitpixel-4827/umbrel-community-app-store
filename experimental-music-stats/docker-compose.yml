version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: experimental-music-stats_web_1
      APP_PORT: 3001

  web:
    image: ghcr.io/orbitpixel-4827/music-stats:1.0.0
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/music-stats.sqlite
      IMAGE_CACHE_DIR: /app/data/image-cache
      FRONTEND_DIST_PATH: /app/frontend/dist
      SYNC_INTERVAL_MINUTES: 30
      TZ: America/Mexico_City
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
