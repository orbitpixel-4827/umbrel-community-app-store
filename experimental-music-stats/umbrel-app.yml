support: https://github.com/orbitpixel-4827/umbrel-community-app-store/issues
gallery: []
releaseNotes: >-
  Primera versión para la tienda. Interfaz MiEstilo clara y responsive,
  navegación inferior en móvil, búsqueda accesible y errores visibles.
