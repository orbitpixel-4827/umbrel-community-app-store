version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: experimental-pokedex_web_1
      APP_PORT: 8765
  web:
    image: ghcr.io/orbitpixel-4827/pokedex:1.2.1@sha256:6798b357bdb4e616bdfe6cb1908be63c36ca5c0afafe4b84a37ed8cc28cee7d1
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      POKEDEX_BASE_URL: ""
      POKEDEX_COOKIE_NAME: pokedex_umbrel_session
      POKEDEX_PASSWORD: ${APP_PASSWORD}
      POKEDEX_DATA_DIR: /data
      POKEDEX_BIND: 0.0.0.0
      POKEDEX_PORT: 8765
      TZ: America/Mexico_City
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
