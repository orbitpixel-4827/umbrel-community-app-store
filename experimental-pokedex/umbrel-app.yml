manifestVersion: 2.0
id: experimental-pokedex
storage:
  dataRoot: data
category: ai
name: Pokédex
version: "1.2.1"
tagline: Escanea, descubre y consulta tus Pokémon
icon: https://raw.githubusercontent.com/orbitpixel-4827/umbrel-community-app-store/main/experimental-pokedex/icon.png
requiresHttps: true
description: >-
  Tu Pokédex personal con el diseño rojo de Ash. Abre la cámara, apunta a un Pokémon
  y escucha su descripción con voz metálica. Consulta imágenes, formas, evoluciones,
  estadísticas, defensas y movimientos por videojuego.


  Requiere umbrelOS 2.0 y HTTPS de Umbrel con su certificado configurado en el teléfono
  para usar la cámara en vivo. En Ajustes, introduce una clave propia de Gemini
  u OpenRouter para reconocimiento y una de Gemini para voz; las cuotas gratuitas
  dependen del proveedor. El historial, preferencias y claves permanecen en tu Umbrel.


  Si vienes de la instalación con Docker Compose, importa tus encuentros desde la
  copia JSON de la app anterior. Las claves y la contraseña no se incluyen en esa
  copia; la guía del paquete explica cómo trasladar también la base completa.
releaseNotes: >-
  Corrige el segundo escaneo: al abrir de nuevo la cámara durante la espera de
  20 segundos, el análisis se inicia automáticamente al terminar. Mejora la
  activación y recuperación de la voz y sonidos desde el acceso directo del
  iPhone. Probar voz muestra preparación, reproducción o un error de audio.
  Se mantienen los registros, claves y cuotas de uso.
developer: Experimental Labs
website: https://github.com/orbitpixel-4827/umbrel-community-app-store
dependencies: []
repo: https://github.com/orbitpixel-4827/umbrel-community-app-store/tree/main/experimental-pokedex
support: https://github.com/orbitpixel-4827/umbrel-community-app-store/issues
port: 9088
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: Experimental Labs
submission: https://github.com/orbitpixel-4827/umbrel-community-app-store/pull/2
