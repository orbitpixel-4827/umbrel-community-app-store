manifestVersion: 2.0
id: experimental-pokedex
storage:
  dataRoot: data
category: ai
name: Pokédex
version: "1.3.2"
tagline: Escanea, descubre y consulta tus Pokémon
icon: https://raw.githubusercontent.com/orbitpixel-4827/umbrel-community-app-store/main/experimental-pokedex/icon.png
requiresHttps: true
description: >-
  Tu Pokédex personal con el diseño rojo de Ash. Abre la cámara, apunta a un Pokémon
  y escucha su descripción con voz metálica. Consulta imágenes, formas, evoluciones,
  estadísticas, defensas y movimientos por videojuego.


  Requiere umbrelOS 2.0 y HTTPS de Umbrel con su certificado configurado en el teléfono
  para usar la cámara en vivo. Puedes reconocer imágenes con tu plan de ChatGPT
  mediante autorización oficial e importación privada por HTTPS, o con una clave
  propia de Gemini u OpenRouter. La voz utiliza Gemini. Las cuotas dependen del
  proveedor o del plan; ChatGPT comparte sus límites de uso con tu cuenta.
  El historial, preferencias y conexiones privadas permanecen en tu Umbrel.


  Si vienes de la instalación con Docker Compose, importa tus encuentros desde la
  copia JSON de la app anterior. Las claves y la contraseña no se incluyen en esa
  copia; la guía del paquete explica cómo trasladar también la base completa.
releaseNotes: >-
  Retira la interfaz antigua que podía quedar guardada en Safari y mostrar una
  versión anterior con una sesión obsoleta. Carga los datos directamente desde
  Umbrel y migra automáticamente la caché anterior sin borrar tu colección.
  Corrige el arranque y la recuperación tras cortes de conexión, limita las
  esperas de red y libera conexiones inactivas del navegador. El audio opcional
  no bloquea el inicio. Conserva tus registros, claves y ajustes; no duplica
  solicitudes de reconocimiento al reconectar.
developer: Experimental Labs
website: https://github.com/orbitpixel-4827/umbrel-community-app-store
dependencies: []
repo: https://github.com/orbitpixel-4827/umbrel-community-app-store/tree/main/experimental-pokedex
support: https://github.com/orbitpixel-4827/umbrel-community-app-store/issues
port: 9088
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: Experimental Labs
submission: https://github.com/orbitpixel-4827/umbrel-community-app-store/pull/4
