manifestVersion: 2.0
id: experimental-pokedex
storage:
  dataRoot: data
category: ai
name: Pokédex
version: "1.4.0"
tagline: Escanea, descubre y consulta tus Pokémon
icon: https://raw.githubusercontent.com/orbitpixel-4827/umbrel-community-app-store/main/experimental-pokedex/icon.png
requiresHttps: true
description: >-
  Tu Pokédex personal con el diseño rojo de Ash. Abre la cámara, apunta a un Pokémon
  y escucha su descripción con voz metálica. Consulta imágenes, formas, evoluciones,
  estadísticas, defensas y movimientos por videojuego.


  Requiere umbrelOS 2.0 y HTTPS de Umbrel con su certificado configurado en el teléfono
  para usar la cámara en vivo. Puedes reconocer imágenes con tu plan de ChatGPT
  mediante autorización oficial e importación privada por HTTPS. La narración
  utiliza GPT-Live y requiere una clave de API de OpenAI con facturación
  independiente de ChatGPT Plus. El reconocimiento comparte los límites de tu
  plan; la voz está sujeta a las cuotas y facturación de tu proyecto de API.
  El historial, preferencias y conexiones privadas permanecen en tu Umbrel.


  Si vienes de la instalación con Docker Compose, importa tus encuentros desde la
  copia JSON de la app anterior. Las claves y la contraseña no se incluyen en esa
  copia; la guía del paquete explica cómo trasladar también la base completa.
releaseNotes: >-
  El corazón de favoritos ahora se rellena de rojo y Colección permite filtrar
  solo favoritos junto con búsqueda y tipo. Reconocimiento conserva únicamente
  ChatGPT. La voz utiliza GPT-Live con audio progresivo y efecto metálico continuo;
  comienza a reproducirse mientras llega, con un resumen más breve y ritmo ágil.
  Solo habla automáticamente después de escanear. Necesita una clave de API de
  OpenAI en Narración, con facturación aparte de ChatGPT Plus. Reutiliza audios
  completados sin abrir otra sesión. Conserva encuentros, favoritos y conexión
  con ChatGPT. Incluye memoria técnica de reconstrucción sin datos sensibles.

developer: Experimental Labs
