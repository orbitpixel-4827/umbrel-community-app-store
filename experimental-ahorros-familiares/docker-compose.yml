version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: experimental-ahorros-familiares_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/orbitpixel-4827/ahorros-familiares:1.0.0@sha256:3c5f409f63193c2d66fd50a7f1141ed4aecbffa762908f76a8668dd2401e6059
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      DATA_DIR: /data
      PORT: 8080
      TZ: America/Mexico_City
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 96
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
