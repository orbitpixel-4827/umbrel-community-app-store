version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: experimental-registro-multimedia_web_1
      APP_PORT: 3000
      # Los iconos deben ser accesibles antes de iniciar sesion para iOS.
      PROXY_AUTH_WHITELIST: "/icons/*,/manifest.json"

  web:
    image: ghcr.io/orbitpixel-4827/registro-multimedia:2.0.0
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/server/data/registro.sqlite
      UPLOAD_DIR: /app/server/uploads
      TZ: America/Mexico_City
      TMDB_API_KEY: ""
      RAWG_API_KEY: ""
      GOOGLE_BOOKS_API_KEY: ""
      COMICVINE_API_KEY: ""
    volumes:
      - ${APP_DATA_DIR}/data:/app/server/data
      - ${APP_DATA_DIR}/uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
